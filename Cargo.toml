[package]
name = "nscb"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A bounded, read-only PFS0 Container Probe for NSCB"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nscb"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[package]
name = "nscb"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A bounded, read-only Probe, Recognition, input-resolution, and qualified Inspection library for NSCB"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nscb"
path = "src/main.rs"

[dependencies]
aes = "0.8"
command-group = "5.0"
fs2 = "0.4"
rsa = { version = "=0.9.10", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3.13"
unicode-normalization = "0.1"
ureq = "=2.12.1"
url = "=2.5.8"
xts-mode = "0.5"
zip = { version = "2.2", default-features = false, features = ["deflate-miniz"] }

[dev-dependencies]
rand = "=0.8.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

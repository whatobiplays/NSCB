name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-policy-git:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run genuine Git content-policy integration tests
        run: make test-content-policy-git

      - name: Run genuine Git worktree cleanup tests
        run: make test-cleanup-git

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())[
              "toolchain"
          ]
          command = [
              "rustup",
              "toolchain",
              "install",
              toolchain["channel"],
              "--profile",
              toolchain.get("profile", "minimal"),
          ]
          for component in toolchain.get("components", []):
              command.extend(["--component", component])
          subprocess.run(command, check=True)
          PY

      - name: Run repository validation
        run: make all

  windows-library-tests:
    name: Windows Server 2025 library tests (Rust 1.98.1 MSVC)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1 MSVC
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy --component rustfmt

      - name: Verify Rust host and version
        shell: pwsh
        run: |
          $info = rustup run $env:RUSTUP_TOOLCHAIN rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info
          if ($info -notcontains "host: x86_64-pc-windows-msvc") { throw "Expected the x86_64 MSVC Rust host" }
          $version = rustup run $env:RUSTUP_TOOLCHAIN rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^rustc 1\.98\.1(\s|$)') { throw "Expected Rust 1.98.1; got $version" }

      - name: Run full no-default-features library suite
        run: cargo test --locked --no-default-features --lib

  windows-library-clippy:
    name: Windows Server 2025 strict library Clippy (Rust 1.98.1 MSVC)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1 MSVC
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy --component rustfmt

      - name: Verify Rust host and version
        shell: pwsh
        run: |
          $info = rustup run $env:RUSTUP_TOOLCHAIN rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info
          if ($info -notcontains "host: x86_64-pc-windows-msvc") { throw "Expected the x86_64 MSVC Rust host" }
          $version = rustup run $env:RUSTUP_TOOLCHAIN rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^rustc 1\.98\.1(\s|$)') { throw "Expected Rust 1.98.1; got $version" }

      - name: Run strict no-default-features library Clippy
        run: cargo clippy --locked --no-default-features --lib -- -D warnings

  macos-all-arm64:
    name: macOS 15 ARM64 make all
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify ARM64 runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustc_info="$(rustup run "$RUSTUP_TOOLCHAIN" rustc -vV)"
          printf '%s\n' "$rustc_info"
          printf '%s\n' "$rustc_info" | grep -Fx "host: aarch64-apple-darwin"

      - name: Run full repository validation
        run: make all

  nsp-semantic-native:
    name: NSP semantic tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 arm64
            runner: macos-15
          - name: Windows Server 2025 x86_64
            runner: windows-2025
          - name: Linux glibc x86_64
            runner: ubuntu-24.04
          - name: Linux glibc arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())[
              "toolchain"
          ]
          command = [
              "rustup",
              "toolchain",
              "install",
              toolchain["channel"],
              "--profile",
              toolchain.get("profile", "minimal"),
          ]
          for component in toolchain.get("components", []):
              command.extend(["--component", component])
          subprocess.run(command, check=True)
          PY

      - name: Run native qualification tests
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib nsp_semantic_qualification::tests::
          cargo test --locked --no-default-features --lib key_file::qualification_tests::
          cargo test --locked --no-default-features --lib pfs0::tests::caller_metadata_limit_is_checked_before_reading_declared_tables
          cargo test --locked --no-default-features --test nsp_semantic_qualification
          cargo test --locked --no-default-features --lib reservation -- --test-threads=1
          cargo test --locked --no-default-features --lib test_allocator::tests:: -- --test-threads=1

      - name: Run XCI conversion capability tests
        shell: bash
        run: |
          cargo test --locked --no-default-features --test xci_to_nsp
          cargo test --locked --features standalone-job-history --test xci_to_nsp_cli

name: PAC-6 pinned legacy consumer

"on":
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - qualification/pac6/trigger.txt

permissions: {}

concurrency:
  group: pac6-legacy-consumer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.number == 93 &&
      github.event.pull_request.head.repo.full_name == 'whatobiplays/NSCB' &&
      github.event.pull_request.head.ref == 'codex/issue-14-legacy-split-layouts' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.action == 'synchronize'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Fetch the exact task revision without repository credentials
        shell: pwsh
        env:
          PAC6_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $credentialVariables = @('GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_URL', 'GIT_ASKPASS', 'SSH_AUTH_SOCK')
          $present = @($credentialVariables | Where-Object { Test-Path "Env:$_" })
          if ($present.Count -gt 0) { throw "Repository credential variables are present: $($present -join ', ')" }
          $workspace = $env:GITHUB_WORKSPACE
          if (Get-ChildItem -LiteralPath $workspace -Force | Select-Object -First 1) { throw 'The hosted task workspace is not empty.' }
          git -c credential.helper= -c http.extraheader= -C $workspace init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize the anonymous task checkout.' }
          git -c credential.helper= -c http.extraheader= -C $workspace remote add origin https://github.com/whatobiplays/NSCB.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to add the public task repository.' }
          git -c credential.helper= -c http.extraheader= -C $workspace fetch --no-tags --depth=1 origin $env:PAC6_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the exact task revision without credentials.' }
          git -c credential.helper= -c http.extraheader= -C $workspace checkout --detach --quiet FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check out the exact task revision.' }
          $actualHead = git -C $workspace rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualHead -ne $env:PAC6_HEAD_SHA) { throw 'The anonymous checkout differs from the pull request head.' }
          $gitConfig = Get-Content -LiteralPath (Join-Path $workspace '.git\config') -Raw
          if ($gitConfig -match '(?i)(extraheader|credential\s*=|https://[^\s/@]+@)') { throw 'Repository credentials were persisted in Git configuration.' }

      - name: Select the pinned CPython runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Prepare the pinned consumer source and offline wheelhouse
        shell: pwsh
        env:
          PAC6_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python qualification/pac6/prepare.py

      - name: Upload the reviewed qualification bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pac6-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pac6-preparation/bundle
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  consume:
    needs: prepare
    if: >-
      github.event.pull_request.number == 93 &&
      github.event.pull_request.head.repo.full_name == 'whatobiplays/NSCB' &&
      github.event.pull_request.head.ref == 'codex/issue-14-legacy-split-layouts' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.action == 'synchronize'
    runs-on: windows-2025
    timeout-minutes: 150
    permissions: {}
    steps:
      - name: Select the pinned CPython runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Download the same-run read-only qualification bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pac6-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pac6-input

      - name: Verify the bundle and install dependencies offline
        shell: pwsh
        env:
          PAC6_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'pac6-input'
          $manifestPath = Join-Path $bundle 'bundle-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.tested_revision -ne $env:PAC6_EXPECTED_HEAD_SHA) { throw 'Bundle revision differs from the pull request head.' }
          if ($manifest.consumer_source.commit -ne '92690c0137f520b6ee4d6c20b6f5abe8a3ce5738' -or $manifest.consumer_source.tree -ne '358d753fe6cca11d5de8a2c60f7c1f25dad88442') { throw 'Bundle source identity differs from the approved consumer pin.' }
          $expectedFiles = @($manifest.bundle_files.PSObject.Properties | Sort-Object Name)
          $expectedNames = @($expectedFiles | ForEach-Object { [string]$_.Name } | Sort-Object)
          $actualNames = @(Get-ChildItem -LiteralPath $bundle -Force -Recurse -File | Where-Object { $_.FullName -ne $manifestPath } | ForEach-Object { $_.FullName.Substring($bundle.Length + 1).Replace('\', '/') } | Sort-Object)
          if ($expectedNames.Count -eq 0 -or $expectedNames.Count -ne $actualNames.Count) { throw 'Qualification bundle file set differs from its manifest.' }
          for ($index = 0; $index -lt $expectedFiles.Count; $index++) {
            $relative = [string]$expectedFiles[$index].Name
            if ($expectedNames[$index] -ne $actualNames[$index]) { throw 'Qualification bundle file set differs from its manifest.' }
            $path = Join-Path $bundle $relative.Replace('/', '\')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Qualification bundle file is missing: $relative" }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne [string]$expectedFiles[$index].Value) { throw "Qualification bundle hash mismatch: $relative" }
          }
          $lockPath = Join-Path $bundle 'requirements-win-cp312.lock'
          $lockHash = (Get-FileHash -LiteralPath $lockPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($lockHash -ne [string]$manifest.dependencies.lock_sha256) { throw 'Dependency lock differs from its recorded SHA-256.' }
          $workspaceGit = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -Recurse -Filter '.git' -ErrorAction SilentlyContinue
          if ($workspaceGit) { throw 'The consumer job unexpectedly contains a repository checkout.' }
          $forbidden = @('GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          $present = @($forbidden | Where-Object { Test-Path "Env:$_" })
          if ($present.Count -gt 0) { throw "Repository credential variables are present: $($present -join ', ')" }
          $bundleGit = Get-ChildItem -LiteralPath $bundle -Force -Recurse -Filter '.git' -ErrorAction SilentlyContinue
          if ($bundleGit) { throw 'The downloaded bundle contains Git credentials or repository metadata.' }
          $basePython = (Get-Command python).Source
          $venv = Join-Path $env:RUNNER_TEMP 'pac6-venv'
          & $basePython -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the isolated Python environment.' }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-index --find-links (Join-Path $bundle 'wheelhouse') --require-hashes -r (Join-Path $bundle 'requirements-win-cp312.lock')
          if ($LASTEXITCODE -ne 0) { throw 'Offline, hash-verified dependency installation failed.' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'The installed dependency closure is inconsistent.' }
          "PAC6_VENV_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Output 'The wheelhouse installed offline and passed pip check.'

      - name: Block and verify Python outbound traffic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'pac6-input'
          $evidence = Join-Path $env:RUNNER_TEMP 'pac6-isolation.json'
          & (Join-Path $bundle 'block-python-egress.ps1') -Python $env:PAC6_VENV_PYTHON -EvidencePath $evidence
          if (-not $?) { throw 'Could not establish the Python network boundary.' }

      - name: Run the byte-exact PAC-6 matrix
        shell: pwsh
        env:
          PAC6_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PAC6_RUNNER_LABEL: windows-2025
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_URL', 'GIT_ASKPASS', 'SSH_AUTH_SOCK')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $bundle = Join-Path $env:RUNNER_TEMP 'pac6-input'
          $work = Join-Path $env:RUNNER_TEMP 'pac6-work'
          $report = Join-Path $env:RUNNER_TEMP 'pac6-report.json'
          $isolation = Join-Path $env:RUNNER_TEMP 'pac6-isolation.json'
          & $env:PAC6_VENV_PYTHON -E -s (Join-Path $bundle 'run_matrix.py') --bundle $bundle --work-dir $work --report $report --isolation-evidence $isolation --python $env:PAC6_VENV_PYTHON
          if ($LASTEXITCODE -ne 0) { throw 'One or more PAC-6 cases failed. See pac6-report.json.' }

      - name: Upload compact PAC-6 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pac6-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pac6-report.json
            ${{ runner.temp }}/pac6-isolation.json
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 6
